  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-gutter flex items-center justify-between"><button aria-label="返回" class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant hover:bg-primary-fixed transition-all active:scale-95" onclick="location.href='10_profile.html'" type="button"><span class="material-symbols-outlined">arrow_back</span></button><span class="font-headline-md text-headline-md text-on-surface">账户管理</span><div class="w-10"></div></div></header><main class="flex flex-col relative w-full px-gutter pt-16 pb-24 bg-[#FFF4F7] flex-1"><div class="flex flex-col w-full py-space-md gap-space-md">
<!-- 账户说明 -->
<div class="flex items-center gap-space-xs px-space-xs text-body-sm text-outline">
<span class="material-symbols-outlined text-primary text-[16px]">info</span>
<span>管理记账时可选择的支付账户（仅作标记，不含余额）</span>
</div>
<!-- 账户列表 -->
<div class="flex flex-col gap-space-sm" id="acct-list"></div>
<!-- 空状态 -->
<div class="hidden flex-col items-center justify-center py-16 text-center" id="acct-empty">
<div class="w-24 h-24 mb-space-md bg-primary-fixed/30 rounded-full flex items-center justify-center">
<span class="text-5xl">🐱</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-space-xs">还没有账户哦</h3>
<p class="text-body-md text-on-surface-variant">添加现金、支付宝、微信等账户吧～</p>
</div>
<!-- 添加账户按钮 -->
<button class="w-full h-12 rounded-full bg-primary-fixed/70 text-primary font-label-lg text-label-lg hover:bg-primary-fixed active:scale-[0.98] transition-all shadow-sm flex items-center justify-center gap-space-xs" onclick="openAdd()" type="button">
<span class="material-symbols-outlined text-[18px]">add_circle</span>
<span>添加账户</span>
</button>
<!-- 编辑/添加弹窗 -->
<div class="fixed inset-0 z-[70] items-center justify-center p-gutter bg-inverse-surface/40 backdrop-blur-sm animate-fade-in" id="acct-modal" onclick="if(event.target===this)closeAcct()" style="display:none">
<div class="w-full max-w-xs bg-surface rounded-3xl p-space-md shadow-2xl flex flex-col">
<h3 class="font-headline-md text-headline-md text-on-surface text-center mb-space-sm" id="acct-modal-title">添加账户</h3>
<div class="flex items-center gap-space-sm mb-space-sm">
<div class="w-12 h-12 rounded-2xl bg-primary-fixed flex items-center justify-center text-2xl shrink-0" id="acct-emoji-preview">💰</div>
<input class="flex-1 h-11 px-space-md rounded-2xl bg-surface-container-low border border-surface-container-high text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" id="acct-name" maxlength="8" placeholder="账户名称，如：现金" type="text"/>
</div>
<input class="w-full h-11 px-space-md rounded-2xl bg-surface-container-low border border-surface-container-high text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all mb-space-sm" id="acct-desc" maxlength="12" placeholder="备注（可选），如：日常现金" type="text"/>
<div class="text-label-md text-outline mb-space-xs">选择图标</div>
<div class="grid grid-cols-8 gap-1.5 mb-space-md" id="acct-emoji-grid"></div>
<div class="grid grid-cols-2 gap-3">
<button class="h-11 rounded-full bg-surface-container-high text-on-surface font-label-lg active:scale-95 transition-all" onclick="closeAcct()" type="button">取消</button>
<button class="h-11 rounded-full bg-primary text-on-primary font-label-lg shadow-md active:scale-95 transition-all" onclick="saveAcct()" type="button">保存</button>
</div>
</div>
</div>
<!-- 删除确认弹窗 -->
<div class="fixed inset-0 z-[80] items-center justify-center p-gutter bg-inverse-surface/40 backdrop-blur-sm animate-fade-in" id="del-modal" onclick="if(event.target===this)closeDel()" style="display:none">
<div class="w-full max-w-xs bg-surface rounded-3xl p-space-md shadow-2xl flex flex-col items-center text-center">
<div class="w-14 h-14 rounded-full bg-error-container text-on-error-container flex items-center justify-center mb-space-sm">
<span class="material-symbols-outlined text-[28px]">warning</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-space-xs">删除账户</h3>
<p class="text-body-md text-on-surface-variant mb-space-md" id="del-text">确定删除该账户吗？</p>
<div class="grid grid-cols-2 gap-3 w-full">
<button class="h-11 rounded-full bg-surface-container-high text-on-surface font-label-lg active:scale-95 transition-all" onclick="closeDel()" type="button">取消</button>
<button class="h-11 rounded-full bg-error text-on-error font-label-lg shadow-md active:scale-95 transition-all" onclick="confirmDel()" type="button">确认删除</button>
</div>
</div>
</div>
<script>
    /* 账户管理：支付账户标记（emoji + 名称）增删改查。仅内存演示：保存/删除后当页即时可见，
       刷新即还原下方初始数据；正式持久化待后续接入数据库再实现 */
    const EMOJIS = ['💰','💙','💚','🏦','🧧','💳','🐱','🐶','🍜','☕','🧋','🚇','🚗','✈️','🏠','🎮','🛍','💊','📈','✨','🧰','🎓','🎁','🐾','🌸','📱','💻','🏥','📦','⚽','🎯','🍖'];
    let accounts = [
      { emoji: '💰', name: '现金',   desc: '零钱与日常现金' },
      { emoji: '💙', name: '支付宝', desc: '第三方支付' },
      { emoji: '💚', name: '微信',   desc: '第三方支付' },
      { emoji: '🏦', name: '招商银行卡', desc: '储蓄卡 · 日常消费' }
    ];
    let editing = -1, delIndex = -1, emojiSel = '💰';

    /* 清掉旧版演示残留的 localStorage 键，让「05 记一笔」等页面也回到初始默认数据 */
    try { localStorage.removeItem('fgj_demo_accounts'); } catch (e) { /* 忽略 */ }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function render() {
      const list = document.getElementById('acct-list');
      const empty = document.getElementById('acct-empty');
      list.innerHTML = '';
      if (!accounts.length) {
        list.classList.add('hidden');
        empty.classList.remove('hidden');
        empty.classList.add('flex');
        return;
      }
      list.classList.remove('hidden');
      empty.classList.add('hidden');
      empty.classList.remove('flex');
      accounts.forEach(function (a, i) {
        const row = document.createElement('div');
        row.className = 'bg-surface-container-lowest rounded-2xl p-space-md flex items-center gap-space-sm shadow-[0_2px_12px_rgba(155,63,90,0.05)]';
        row.innerHTML =
          '<div class="w-12 h-12 rounded-2xl bg-primary-fixed/60 flex items-center justify-center text-2xl shrink-0">' + a.emoji + '</div>' +
          '<div class="flex flex-col min-w-0 flex-1">' +
            '<span class="text-label-lg text-on-surface font-bold">' + esc(a.name) + '</span>' +
            '<span class="text-body-sm text-outline truncate">' + esc(a.desc || '—') + '</span>' +
          '</div>' +
          '<button aria-label="编辑" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-primary hover:bg-primary-fixed active:scale-95 transition-all shrink-0" onclick="openEdit(' + i + ')" type="button"><span class="material-symbols-outlined text-[18px]">edit</span></button>' +
          '<button aria-label="删除" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-error hover:bg-error-container/40 active:scale-95 transition-all shrink-0" onclick="askDelete(' + i + ')" type="button"><span class="material-symbols-outlined text-[18px]">delete</span></button>';
        list.appendChild(row);
      });
    }

    function renderEmojiGrid() {
      const grid = document.getElementById('acct-emoji-grid');
      grid.innerHTML = '';
      EMOJIS.forEach(function (e) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = e;
        b.className = 'w-9 h-9 rounded-full flex items-center justify-center text-xl transition-all active:scale-90 ' +
          (e === emojiSel ? 'bg-primary-fixed ring-2 ring-primary' : 'bg-surface-container-low hover:bg-surface-container');
        b.onclick = function () {
          emojiSel = e;
          document.getElementById('acct-emoji-preview').textContent = e;
          renderEmojiGrid();
        };
        grid.appendChild(b);
      });
    }

    function openAdd() {
      editing = -1;
      emojiSel = EMOJIS[0];
      document.getElementById('acct-modal-title').textContent = '添加账户';
      document.getElementById('acct-name').value = '';
      document.getElementById('acct-desc').value = '';
      document.getElementById('acct-emoji-preview').textContent = emojiSel;
      renderEmojiGrid();
      document.getElementById('acct-modal').style.display = 'flex';
      setTimeout(function () { document.getElementById('acct-name').focus(); }, 50);
    }

    function openEdit(i) {
      editing = i;
      const a = accounts[i];
      emojiSel = a.emoji;
      document.getElementById('acct-modal-title').textContent = '编辑账户';
      document.getElementById('acct-name').value = a.name;
      document.getElementById('acct-desc').value = a.desc || '';
      document.getElementById('acct-emoji-preview').textContent = a.emoji;
      renderEmojiGrid();
      document.getElementById('acct-modal').style.display = 'flex';
    }

    function closeAcct() {
      document.getElementById('acct-modal').style.display = 'none';
    }

    function saveAcct() {
      const nameEl = document.getElementById('acct-name');
      const name = (nameEl.value || '').trim();
      if (!name) { nameEl.focus(); return; }
      const desc = (document.getElementById('acct-desc').value || '').trim();
      if (editing > -1) {
        accounts[editing] = { emoji: emojiSel, name: name, desc: desc };
      } else {
        accounts.push({ emoji: emojiSel, name: name, desc: desc });
      }
      render();
      closeAcct();
    }

    function askDelete(i) {
      delIndex = i;
      document.getElementById('del-text').textContent = '确定删除「' + accounts[i].name + '」吗？';
      document.getElementById('del-modal').style.display = 'flex';
    }

    function closeDel() {
      document.getElementById('del-modal').style.display = 'none';
    }

    function confirmDel() {
      if (delIndex > -1) accounts.splice(delIndex, 1);
      delIndex = -1;
      render();
      closeDel();
    }

    render();
  </script>
</div></main>
