<script>
    /* 头像：点击上传本地图片 → 后端落盘并写库（user.avatar_url），刷新后仍显示 */
    function setAvatar(url) {
      const img = document.getElementById('avatar-img');
      const emoji = document.getElementById('avatar-emoji');
      if (url) {
        img.src = url;
        img.classList.remove('hidden');
        emoji.classList.add('hidden');
      } else {
        img.classList.add('hidden');
        emoji.classList.remove('hidden');
      }
    }

    function changeAvatar(ev) {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      if (!/^image\//.test(f.type)) { alert('请选择图片文件'); return; }
      const reader = new FileReader();
      reader.onload = function (e) {
        const dataUrl = e.target.result;
        fetch('/api/profile/avatar', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ avatar: dataUrl })
        }).then(function (r) {
          return r.json().then(function (data) { return { ok: r.ok, data: data }; });
        }).then(function (res) {
          if (res.ok && res.data.avatarUrl) {
            setAvatar(res.data.avatarUrl);
          } else {
            alert(res.data.message || '头像上传失败');
          }
        }).catch(function () { alert('网络异常，头像上传失败'); });
      };
      reader.readAsDataURL(f);
      ev.target.value = '';   // 允许再次选择同一张图
    }

    /* 刷新防闪现：head 里已给 <html> 加 profile-filling 隐藏待填充字段，两个异步请求各自完成后
       计数，全部结束（成功或回落）才移除类、显示结果；纯原型预览无后端时同样走回落并显示演示值。 */
    var profileFills = 2;
    function fillDone() {
      if (--profileFills <= 0) {
        document.documentElement.classList.remove('profile-filling');
      }
    }

    /* 正式接线：昵称、注册时间、头像取自当前登录用户（/api/auth/me → user 表）；
       未登录或后端不可用时保留演示名「小桃子酱」（纯原型预览兼容） */
    (function fillProfile() {
      fetch('/api/auth/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
        if (me) {
          document.getElementById('profile-username').textContent = me.username;
          if (me.registeredAt) {
            document.getElementById('profile-reg').textContent = '注册于 ' + me.registeredAt;
          }
          if (me.id && me.joinedDays) {
            document.getElementById('profile-badge').textContent =
              '已坚持记账 ' + me.joinedDays + ' 天 · UID: ' + me.id;
          }
          setAvatar(me.avatarUrl || '');
        }
        fillDone();
      }).catch(function () { fillDone(); });
    })();

    /* 记账统计：累计记账 / 记账天数 / 本月记账（/api/profile/stats → bill 表实时聚合） */
    (function fillStats() {
      fetch('/api/profile/stats').then(function (r) { return r.ok ? r.json() : null; }).then(function (s) {
        if (s) {
          document.getElementById('stat-total').textContent = s.totalCount;
          document.getElementById('stat-days').textContent = s.daysCount;
          document.getElementById('stat-month').textContent = s.monthCount;
        }
        fillDone();
      }).catch(function () { fillDone(); });
    })();

    function showLogoutModal() {
      const container = document.getElementById('modal-container');
      container.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
          <div class="w-full max-w-xs bg-[#FFFBFC] rounded-3xl p-6 custom-card-shadow flex flex-col items-center text-center border border-[#FFF0F4]">
            <div class="w-13 h-13 p-3 rounded-full bg-[#FFE5EC] text-primary flex items-center justify-center mb-3">
              <span class="material-symbols-outlined text-[26px]">logout</span>
            </div>
            <h3 class="text-base font-bold text-on-surface mb-1.5">确定要退出登录吗？</h3>
            <p class="text-xs text-on-surface-variant mb-5 leading-relaxed">退出后本地未同步的数据可能会丢失哦~</p>
            <div class="grid grid-cols-2 gap-2.5 w-full">
              <button onclick="closeModal()" class="h-10 rounded-full bg-[#F5E9EC] text-on-surface text-xs font-semibold active:scale-95 transition-all">取消</button>
              <button onclick="doLogout(this)" class="h-10 rounded-full bg-primary text-white text-xs font-semibold active:scale-95 transition-all shadow-sm">退出</button>
            </div>
          </div>
        </div>
      `;
    }

    function showDeleteModal() {
      const container = document.getElementById('modal-container');
      container.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
          <div class="w-full max-w-xs bg-[#FFFBFC] rounded-3xl p-6 custom-card-shadow flex flex-col items-center text-center border border-[#FFF0F4]">
            <div class="w-13 h-13 p-3 rounded-full bg-error-container text-on-error-container flex items-center justify-center mb-3">
              <span class="material-symbols-outlined text-[26px]">warning</span>
            </div>
            <h3 class="text-base font-bold text-on-surface mb-1.5">注销账号</h3>
            <p class="text-xs text-on-surface-variant mb-4 leading-relaxed">提交后进入 7 天冷静期，冷静期内登录可撤销；期满后所有记账数据将被永久删除，无法找回。</p>
            <input id="delete-password" type="password" placeholder="请输入登录密码确认" class="w-full h-11 px-4 rounded-full bg-[#F5E9EC] text-on-surface text-sm outline-none focus:ring-2 focus:ring-primary/40 mb-5" />
            <div class="grid grid-cols-2 gap-2.5 w-full">
              <button onclick="closeModal()" class="h-10 rounded-full bg-[#F5E9EC] text-on-surface text-xs font-semibold active:scale-95 transition-all">我再想想</button>
              <button onclick="confirmDeactivate()" class="h-10 rounded-full bg-error text-white text-xs font-semibold active:scale-95 transition-all shadow-sm">确认注销</button>
            </div>
          </div>
        </div>
      `;
    }

    function confirmDeactivate() {
      const password = document.getElementById('delete-password').value;
      if (!password) { alert('请输入登录密码'); return; }
      fetch('/api/auth/deactivate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password })
      }).then(function (r) {
        return r.json().then(function (data) { return { ok: r.ok, data: data }; });
      }).then(function (res) {
        if (res.ok) {
          alert(res.data.message || '注销申请已提交');
          location.replace('02_login.html');
        } else {
          alert(res.data.message || '操作失败，请稍后再试');
        }
      }).catch(function () { alert('网络异常，请稍后再试'); });
    }

    function closeModal() {
      const container = document.getElementById('modal-container');
      container.innerHTML = '';
    }
  </script>

<script>
    // 图标字体就绪后再显示图标；此处内联脚本会等 head 里的字体样式表加载完才执行，3 秒超时兜底
    (function () {
      var ready = false;
      function once() {
        if (ready) return;
        ready = true;
        document.documentElement.classList.remove('icons-loading');
      }
      try {
        document.fonts.load('20px "Material Symbols Outlined"').then(once, once);
      } catch (e) {
        once();
        return;
      }
      setTimeout(once, 3000);
    })();
  </script>
