<script>
    /* 分类与账户数据：仅内存演示——页内新增/选择当页即时生效，刷新即还原下方初始数据；
       正式的保存与增删改查待后续接入数据库再实现（与「账户管理（12）/ 分类管理（13）」同一约定） */
    let cats = {
      expense: [
        { emoji: '🍜', name: '餐饮' },
        { emoji: '🚇', name: '交通' },
        { emoji: '🏠', name: '居家' },
        { emoji: '🎮', name: '娱乐' },
        { emoji: '🛍', name: '购物' },
        { emoji: '💊', name: '医疗' }
      ],
      income: [
        { emoji: '💰', name: '工资' },
        { emoji: '🧰', name: '劳务' },
        { emoji: '✨', name: '外快' },
        { emoji: '📈', name: '理财' }
      ]
    };
    let accounts = [
      { emoji: '💰', name: '现金' },
      { emoji: '💙', name: '支付宝' },
      { emoji: '💚', name: '微信' },
      { emoji: '🏦', name: '招商银行卡' }
    ];
    /* 进页清除旧版残留的演示键（演示数据已改为仅内存，不再读写 localStorage） */
    try { localStorage.removeItem('fgj_demo_cats'); localStorage.removeItem('fgj_demo_accounts'); } catch (e) { /* 忽略 */ }

    let curTab = 'expense';                    // 当前支出/收入
    let catSel = { expense: 0, income: 0 };    // 两套画面各自记住选中的分类
    let paySel = { expense: 0, income: 0 };    // 各自记住选中的账户

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /* 支出=樱花粉（primary），收入=薄荷绿（secondary）：切 Tab 即换整套画面与文案 */
    function switchTab(type) {
      curTab = type;
      const expBtn = document.getElementById('tab-expense');
      const incBtn = document.getElementById('tab-income');
      if (type === 'expense') {
        expBtn.className = "flex-1 py-2 rounded-full text-label-lg transition-all bg-primary text-on-primary shadow-sm";
        incBtn.className = "flex-1 py-2 rounded-full text-label-lg transition-all text-on-surface-variant hover:text-on-surface";
      } else {
        incBtn.className = "flex-1 py-2 rounded-full text-label-lg transition-all bg-secondary text-on-secondary shadow-sm";
        expBtn.className = "flex-1 py-2 rounded-full text-label-lg transition-all text-on-surface-variant hover:text-on-surface";
      }
      document.getElementById('amount-deco').className = 'absolute -right-10 -bottom-10 w-32 h-32 rounded-full pointer-events-none ' +
        (type === 'expense' ? 'bg-primary-container/20' : 'bg-secondary-container/30');
      document.getElementById('currency-symbol').className = 'text-headline-lg font-headline-lg ' +
        (type === 'expense' ? 'text-primary' : 'text-secondary');
      document.getElementById('note-input').placeholder = type === 'expense' ? '这笔钱花在哪里了？' : '这笔钱从哪儿来呀？';
      document.getElementById('pay-label').textContent = type === 'expense' ? '支付方式' : '收款账户';
      document.getElementById('save-btn').className = 'w-full py-4 rounded-full font-headline-md text-body-lg shadow-lg hover:brightness-105 active:scale-[0.98] transition-all flex items-center justify-center gap-space-sm ' +
        (type === 'expense' ? 'bg-primary-container text-on-primary-container' : 'bg-secondary-container text-on-secondary-container');
      renderCats();
      renderPay();
    }

    /* 分类九宫格：emoji + 名称，读「分类管理」当前类型的数据，末位恒为「新分类」 */
    function renderCats() {
      const grid = document.getElementById('category-grid');
      const arr = cats[curTab] || [];
      if (catSel[curTab] >= arr.length) catSel[curTab] = Math.max(0, arr.length - 1);
      grid.innerHTML = '';
      arr.forEach(function (c, i) {
        const on = i === catSel[curTab];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'category-btn flex flex-col items-center justify-center p-space-lg rounded-xl bg-surface-container-low hover:bg-surface-container transition-all group border-2 ' +
          (on ? (curTab === 'expense' ? 'border-primary' : 'border-secondary') : 'border-transparent');
        const circ = on
          ? (curTab === 'expense'
              ? 'bg-primary-container/30 text-on-primary-container'
              : 'bg-secondary-container/60 text-on-secondary-container')
          : 'bg-surface-container text-on-surface-variant';
        btn.innerHTML =
          '<div class="w-12 h-12 rounded-full flex items-center justify-center mb-space-sm group-hover:scale-110 transition-transform ' + circ + '">' +
            '<span class="text-2xl leading-none">' + c.emoji + '</span>' +
          '</div>' +
          '<span class="text-body-md font-medium text-on-surface">' + esc(c.name) + '</span>';
        btn.onclick = function () { selectCategory(i); };
        grid.appendChild(btn);
      });
      const add = document.createElement('button');
      add.type = 'button';
      add.className = 'flex flex-col items-center justify-center p-space-lg rounded-xl bg-surface-container-low hover:bg-surface-container transition-all border-2 border-dashed border-outline-variant group';
      add.innerHTML =
        '<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-primary mb-space-sm group-hover:rotate-90 transition-transform">' +
          '<span class="material-symbols-outlined">add</span>' +
        '</div>' +
        '<span class="text-body-md font-medium text-on-surface-variant">新分类</span>';
      add.onclick = addNewCategory;
      grid.appendChild(add);
    }

    function selectCategory(i) {
      catSel[curTab] = i;
      renderCats();
    }

    /* 支付/收款账户药丸：emoji + 名称，读「账户管理」的数据 */
    function renderPay() {
      const wrap = document.getElementById('pay-grid');
      wrap.innerHTML = '';
      accounts.forEach(function (a, i) {
        const on = i === paySel[curTab];
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'pay-btn px-space-md py-2 rounded-full text-body-sm font-medium transition-all ' +
          (on
            ? (curTab === 'expense' ? 'bg-primary text-on-primary shadow-xs' : 'bg-secondary text-on-secondary shadow-xs')
            : 'bg-surface-container text-on-surface-variant');
        b.innerHTML = '<span class="mr-1">' + a.emoji + '</span>' + esc(a.name);
        b.onclick = function () { selectPayment(i); };
        wrap.appendChild(b);
      });
    }

    function selectPayment(i) {
      paySel[curTab] = i;
      renderPay();
    }

    function appendNum(val) {
      const input = document.getElementById('amount-input');
      let current = input.value;
      if (current === '0.00') current = '';

      if (val === 'C') {
        input.value = '0.00';
        return;
      }
      if (val === 'del') {
        current = current.slice(0, -1);
        input.value = current === '' ? '0.00' : current;
        return;
      }
      if (val === '.' && current.includes('.')) return;

      input.value = current + val;
    }

    function addNewCategory() {
      const modal = document.getElementById('add-cat-modal');
      const input = document.getElementById('new-cat-input');
      document.getElementById('add-cat-title').textContent = '新建' + (curTab === 'expense' ? '支出' : '收入') + '分类';
      input.value = '';
      modal.style.display = 'flex';
      setTimeout(() => input.focus(), 50);
    }

    function closeAddCat() {
      document.getElementById('add-cat-modal').style.display = 'none';
    }

    /* 新分类仅存内存（默认 ✨ 图标）：当页即时可见并选中，刷新后即还原 */
    function confirmAddCat() {
      const input = document.getElementById('new-cat-input');
      const name = (input.value || '').trim();
      if (!name) { input.focus(); return; }
      cats[curTab].push({ emoji: '✨', name: name });
      catSel[curTab] = cats[curTab].length - 1;
      renderCats();
      closeAddCat();
    }

    function handleSave() {
      const toast = document.getElementById('success-toast');
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      const btn = document.getElementById('save-btn');
      btn.classList.add('animate-pulse');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
        btn.classList.remove('animate-pulse');
        document.getElementById('amount-input').value = '0.00';
      }, 1500);
    }

    /* —— 日期控件（与 06/07 同款；本页无 < > 步进钮，点日期栏弹日历直选年月日）—— */
    const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
    const today = () => { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() + 1, d: t.getDate() }; };
    const daysInMonth = (y, m) => new Date(y, m, 0).getDate();   // m 取 1~12，闰年由 Date 自行处理
    const fmtDate = c => c.y + '年' + c.m + '月' + c.d + '日';

    let cur = today();                    // 当前选中日期（默认今天）
    let viewY = cur.y, viewM = cur.m;     // 日历弹窗正在展示的年月

    function renderDate() {
      document.getElementById('date-label').textContent = fmtDate(cur);
    }

    function openCalendar() {
      viewY = cur.y; viewM = cur.m;
      renderCal();
      document.getElementById('calendar-pop').style.display = 'flex';
    }

    function closeCalendar() {
      document.getElementById('calendar-pop').style.display = 'none';
    }

    function calStep(n, unit) {   // 日历标题翻页：月进位跨年
      if (unit === 'y') { viewY += n; }
      else {
        viewM += n;
        if (viewM > 12) { viewM = 1; viewY++; }
        if (viewM < 1) { viewM = 12; viewY--; }
      }
      renderCal();
    }

    function renderCal() {
      document.getElementById('cal-title').textContent = viewY + '年' + viewM + '月';
      document.getElementById('cal-week').innerHTML = WEEK.map(w => '<span>' + w + '</span>').join('');
      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '';
      const first = new Date(viewY, viewM - 1, 1).getDay();   // 当月 1 日是周几
      const dim = daysInMonth(viewY, viewM);
      const t = today();
      for (let i = 0; i < first; i++) grid.appendChild(document.createElement('span'));
      for (let d = 1; d <= dim; d++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = d;
        const sel = d === cur.d && viewM === cur.m && viewY === cur.y;
        const isToday = d === t.d && viewM === t.m && viewY === t.y;
        b.className = 'h-9 w-9 rounded-full flex items-center justify-center text-label-lg font-bold transition-all active:scale-95 ' +
          (sel ? 'bg-primary text-on-primary shadow-md'
               : isToday ? 'text-primary bg-primary-fixed/50 hover:bg-primary-fixed'
               : 'text-on-surface hover:bg-surface-container');
        b.onclick = () => pickDay(viewY, viewM, d);
        grid.appendChild(b);
      }
    }

    function pickDay(y, m, d) {
      cur = { y: y, m: m, d: d };
      renderDate();
      closeCalendar();
    }

    function gotoToday() {
      cur = today();
      renderDate();
      closeCalendar();
    }

    switchTab('expense');
    renderDate();
  </script>
