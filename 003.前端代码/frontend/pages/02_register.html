<div id="modal-container"></div>
<script>
    function togglePassword(btn) {
      const input = btn.previousElementSibling;
      const icon = btn.querySelector('.material-symbols-outlined');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility_off';
      }
    }

    // 密码规范提示弹窗（样式同 11_settings 退出弹窗：全屏遮罩 + 居中卡片，设计令牌取自本页配置）
    function showPwdRuleModal() {
      document.getElementById('modal-container').innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-gutter bg-inverse-surface/40 backdrop-blur-sm animate-fade-in">
          <div class="w-full max-w-xs bg-surface rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center">
            <div class="w-14 h-14 rounded-full bg-primary-fixed text-primary flex items-center justify-center mb-4">
              <span class="material-symbols-outlined text-[28px]">lock</span>
            </div>
            <h3 class="text-headline-md font-headline-md text-on-surface mb-2">密码不符合规范，请重新输入</h3>
            <p class="text-body-md text-on-surface-variant mb-6">需 6 位以上，且包含数字、小写字母、大写字母、特殊字符中的至少三种</p>
            <button onclick="closeModal()" class="w-full h-12 rounded-full bg-primary text-on-primary font-label-lg active:scale-95 transition-all">我知道了</button>
          </div>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    // 正式接线（003.前端代码/backend）：注册表单 → POST /api/auth/register，
    // 成功即自动登录直进记账页（PRD F1-4：新账号按附录 A 模板初始化分类/账户）
    (function () {
      var form = document.getElementById('form-register');
      var btn = form.querySelector('button[type="submit"]');
      var errBox = document.getElementById('form-error');
      function showMsg(text) {
        errBox.textContent = text || '';
        errBox.classList.toggle('hidden', !text);
      }
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (btn.disabled) return;
        if (!document.getElementById('reg-agreement').checked) {
          showMsg('请先阅读并同意用户协议与隐私政策'); // PRD F1 验收 7：未勾选协议不可注册
          return;
        }
        var username = form.querySelector('input[name="reg-username-off"]').value.trim();
        var password = form.querySelector('input[name="reg-password-off"]').value;
        var confirmPassword = form.querySelector('input[name="reg-password2-off"]').value;
        if (!username || !password || !confirmPassword) { showMsg('请填写完整的注册信息'); return; }
        if (password !== confirmPassword) { showMsg('两次输入的密码不一致'); return; }
        // PRD F1-2：密码需 6 位以上，且包含数字/小写/大写/特殊字符四类中的至少三类；不符弹居中提示框拦截提交
        var pwKinds = (/\d/.test(password) ? 1 : 0) + (/[a-z]/.test(password) ? 1 : 0) + (/[A-Z]/.test(password) ? 1 : 0) + (/[^A-Za-z0-9]/.test(password) ? 1 : 0);
        if (password.length < 6 || pwKinds < 3) { showPwdRuleModal(); return; }
        btn.disabled = true;
        showMsg('');
        fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password, confirmPassword: confirmPassword })
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (data) {
            return { ok: r.ok, data: data };
          });
        }).then(function (res) {
          if (res.ok) { location.href = '05_add_record.html'; return; } // 注册成功自动登录直进主界面
          btn.disabled = false;
          showMsg(res.data.message || '注册失败，请稍后再试');
        }).catch(function () {
          btn.disabled = false;
          showMsg('网络异常，请稍后再试');
        });
      });
    })();
  </script>

<script>
    // 图标字体就绪后再显示图标；此处内联脚本会等 head 里的字体样式表加载完才执行，3 秒超时兜底
    (function () {
      var ready = false;
      function once() {
        if (ready) return;
        ready = true;
        document.documentElement.classList.remove('icons-loading');
      }
      try {
        document.fonts.load('20px "Material Symbols Outlined"').then(once, once);
      } catch (e) {
        once();
        return;
      }
      setTimeout(once, 3000);
    })();
  </script>
