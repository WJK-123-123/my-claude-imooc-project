<script>
    /* 07 统计页：按「年」聚合的收支统计。
       数据来自 /api/stats?year=YYYY：记账笔数 / 月均支出 / 最大单笔 + 支出/收入分类排行 + 环形占比图。
       金额在 JS 内以「分」整数运算后格式化展示，全程无浮点（PRD 金额硬约定）。 */

    const THIS_YEAR = new Date().getFullYear();   // 年份选择器上界：固定当前自然年，不随所选年份变化
    let curYear = THIS_YEAR;
    let stats = null;   // 最近一次 /api/stats 返回的原始数据
    const PAGE_SIZE = 8;   // 排行列表每页条数（卡片约 88px 高，8 条约一屏，桌面/手机端均宜）
    let activeTab = 'expense';            // 当前选中的排行标签，决定滚动加载哪个列表
    const shown = { expense: 0, income: 0 }; // 两列表已渲染条数
    let sentinelObserver = null;          // 「加载下一页」的可见性观察器

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    // 分 → 元字符串（纯整数运算：千分位逗号 + 两位小数）
    function centsToYuan(c) {
      c = Math.max(0, Math.floor(c || 0));
      const yuan = Math.floor(c / 100);
      const fen = c % 100;
      return String(yuan).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + String(fen).padStart(2, '0');
    }
    // 环形图分类配色（高饱和鲜艳色，固定顺序分配、不循环；已通过 CVD/明度/对比度校验）
    const CHART_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
    const MAX_SLICES = 8; // 环形图最多 8 个扇区，超出部分折叠为「其他」，避免颜色循环导致同色歧义

    // 金额占比文案：不足 0.05% 显示 <0.1%，其余保留一位小数
    function pctLabel(ratio) {
      const pct = ratio * 100;
      if (pct > 0 && pct < 0.05) return '<0.1%';
      return pct.toFixed(1) + '%';
    }
    // 分 → 紧凑元字符串（整数运算；≥1 万用「x.x万」，其余千分位整数），用于环心总额展示
    function yuanCompact(c) {
      const yuan = Math.floor(Math.max(0, c || 0) / 100);
      if (yuan >= 10000) {
        const wan = Math.floor(yuan / 10000);
        const qian = Math.floor((yuan % 10000) / 1000);
        return wan + '.' + qian + '万';
      }
      return yuan.toLocaleString('en-US');
    }
    // 组装环形图扇区：按金额降序（后端已排序），超过 MAX_SLICES 的尾部折叠为「其他」
    function buildSlices(type) {
      const cats = type === 'expense' ? (stats?.expenseCategories || []) : (stats?.incomeCategories || []);
      if (cats.length <= MAX_SLICES) {
        return cats.map((c) => ({ name: c.name, icon: c.icon, amount: c.amount, count: c.count }));
      }
      const top = cats.slice(0, MAX_SLICES - 1);
      const rest = cats.slice(MAX_SLICES - 1);
      const folded = {
        name: '其他', icon: '📦',
        amount: rest.reduce((s, c) => s + (c.amount || 0), 0),
        count: rest.reduce((s, c) => s + (c.count || 0), 0),
      };
      return [...top, folded];
    }

    function switchTab(type) {
      const expBtn = document.getElementById('tab-expense');
      const incBtn = document.getElementById('tab-income');
      const expList = document.getElementById('list-expense');
      const incList = document.getElementById('list-income');
      activeTab = type;
      if (type === 'expense') {
        expBtn.className = 'flex-1 py-2 rounded-lg bg-surface-container-lowest text-primary font-bold text-label-lg shadow-sm transition-all';
        incBtn.className = 'flex-1 py-2 rounded-lg text-on-surface-variant font-bold text-label-lg transition-all';
        expList.classList.remove('hidden'); expList.classList.add('flex');
        incList.classList.remove('flex'); incList.classList.add('hidden');
      } else {
        incBtn.className = 'flex-1 py-2 rounded-lg bg-surface-container-lowest text-primary font-bold text-label-lg shadow-sm transition-all';
        expBtn.className = 'flex-1 py-2 rounded-lg text-on-surface-variant font-bold text-label-lg transition-all';
        incList.classList.remove('hidden'); incList.classList.add('flex');
        expList.classList.remove('flex'); expList.classList.add('hidden');
      }
      observeSentinel(type);
    }

    async function loadStats(year) {
      try {
        const r = await fetch('/api/stats?year=' + year);
        if (r.status === 401) { location.replace('02_login.html'); return; }
        const data = await r.json();
        if (!r.ok) throw new Error(data.message || '加载失败');
        stats = data;
        curYear = data.year;
      } catch (e) {
        stats = null;   // 网络异常静默回落为空状态，避免白屏
        curYear = year;
      }
      renderAll();
    }

    function renderAll() {
      document.getElementById('year-label').textContent = curYear + '年';
      document.getElementById('chart-year').textContent = curYear + '年';
      renderOverview();
      renderPie('expense');
      renderPie('income');
      renderLineChart();
      renderList('expense');
      renderList('income');
      renderEmpty();
      observeSentinel(activeTab);
    }

    function renderOverview() {
      const s = stats || {};
      document.getElementById('stat-count').textContent = (s.totalCount || 0) + ' 笔';
      document.getElementById('stat-monthly').textContent = '¥ ' + centsToYuan(s.monthlyAvgExpense || 0);
      if (s.maxExpense && s.maxExpense.amount > 0) {
        document.getElementById('stat-max').textContent = '¥ ' + centsToYuan(s.maxExpense.amount);
        document.getElementById('stat-max-cat').textContent = s.maxExpense.categoryName || '';
      } else {
        document.getElementById('stat-max').textContent = '—';
        document.getElementById('stat-max-cat').textContent = '';
      }
    }

    // 环形图：扇区白色描边分隔 + 环心总额 + 右侧图例（色点/图标/名称/金额/占比）。
    // 悬停或点按扇区/图例高亮该分类：其余扇区变淡、被选扇区外扩、环心切换为分类详情。
    const pieGeo = { expense: [], income: [] };     // 各扇区 { start, sweep, mid }（度）
    const pieHover = { expense: -1, income: -1 };   // 当前高亮扇区下标，-1 表示无

    function renderPie(type) {
      const el = document.getElementById('pie-' + type);
      const legendEl = document.getElementById('legend-' + type);
      const slices = buildSlices(type);
      const total = slices.reduce((sum, c) => sum + (c.amount || 0), 0);
      const size = 144, cx = size / 2, cy = size / 2, rOuter = 62, rInner = 42;
      legendEl.innerHTML = '';
      pieHover[type] = -1;
      if (!slices.length || total <= 0) {
        el.innerHTML = '<svg viewBox="0 0 ' + size + ' ' + size + '" class="w-full h-full">' +
          '<circle cx="' + cx + '" cy="' + cy + '" r="' + rInner + '" fill="#f6ebee"></circle>' +
          '<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#877275" font-size="11">暂无数据</text></svg>';
        return;
      }

      // 极坐标（12 点方向为 0°，顺时针）；返回该半径上的坐标点
      const ringPt = (r, deg) => {
        const rad = (deg - 90) * Math.PI / 180;
        return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
      };
      let start = 0;
      const geo = [];
      const paths = [];
      const labels = [];
      slices.forEach((cat, i) => {
        const sweep = cat.amount / total * 360;
        const end = start + sweep;
        const mid = start + sweep / 2;
        geo.push({ start: start, sweep: sweep, mid: mid });
        if (slices.length === 1) {
          // 单分类占满整圆：画整圈环（扇形弧会退化为空）
          paths.push('<circle class="pie-slice" data-i="0" cx="' + cx + '" cy="' + cy + '" r="' + ((rOuter + rInner) / 2) + '" fill="none" stroke="' + CHART_COLORS[0] + '" stroke-width="' + (rOuter - rInner) + '"></circle>');
        } else {
          const large = sweep > 180 ? 1 : 0;
          const a = ringPt(rOuter, start), b = ringPt(rOuter, end);
          const c = ringPt(rInner, end), d = ringPt(rInner, start);
          const pathD = 'M ' + a.x.toFixed(2) + ' ' + a.y.toFixed(2) +
            ' A ' + rOuter + ' ' + rOuter + ' 0 ' + large + ' 1 ' + b.x.toFixed(2) + ' ' + b.y.toFixed(2) +
            ' L ' + c.x.toFixed(2) + ' ' + c.y.toFixed(2) +
            ' A ' + rInner + ' ' + rInner + ' 0 ' + large + ' 0 ' + d.x.toFixed(2) + ' ' + d.y.toFixed(2) + ' Z';
          paths.push('<path class="pie-slice" data-i="' + i + '" d="' + pathD + '" fill="' + CHART_COLORS[i] + '" stroke="#ffffff" stroke-width="2"></path>');
        }
        // 大扇区在环上直接标注百分比
        if (slices.length > 1 && sweep >= 24) {
          const lp = ringPt((rOuter + rInner) / 2, mid);
          labels.push('<text x="' + lp.x.toFixed(1) + '" y="' + lp.y.toFixed(1) + '" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700" pointer-events="none">' + pctLabel(cat.amount / total) + '</text>');
        }
        start = end;
      });
      pieGeo[type] = geo;

      const hole = '<circle cx="' + cx + '" cy="' + cy + '" r="' + rInner + '" fill="#ffffff"></circle>';
      const center =
        '<g id="pie-center-' + type + '">' +
          '<text x="' + cx + '" y="' + cy + '" dominant-baseline="middle" text-anchor="middle" fill="#877275" font-size="10">' + (type === 'expense' ? '总支出' : '总收入') + '</text>' +
        '</g>';

      el.innerHTML = '<svg viewBox="0 0 ' + size + ' ' + size + '" class="pie-svg w-full h-full" style="filter:drop-shadow(0 4px 12px rgba(255,143,171,0.16))">' +
        paths.join('') + hole + center + labels.join('') + '</svg>';

      // 扇区事件：悬停高亮，点按切换（兼顾移动端无 hover）
      el.querySelectorAll('.pie-slice').forEach((p) => {
        p.addEventListener('mouseenter', () => highlightSlice(type, Number(p.dataset.i)));
        p.addEventListener('mouseleave', () => clearSlice(type));
        p.addEventListener('click', () => {
          const i = Number(p.dataset.i);
          pieHover[type] === i ? clearSlice(type) : highlightSlice(type, i);
        });
      });

      // 图例：色点 + 图标/名称 + 笔数·金额 + 百分比；悬停/点按联动高亮
      slices.forEach((cat, i) => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-space-xs cursor-pointer rounded-lg px-1.5 py-1 -mx-1.5 hover:bg-surface-container-low transition-colors';
        row.innerHTML =
          '<span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:' + CHART_COLORS[i] + '"></span>' +
          '<div class="flex-1 min-w-0 flex flex-col">' +
            '<span class="text-body-sm text-on-surface truncate">' + esc(cat.icon || '📝') + ' ' + esc(cat.name) + '</span>' +
            '<span class="text-label-sm text-on-surface-variant tabular-nums">' + (cat.count || 0) + '笔 · ¥ ' + centsToYuan(cat.amount) + '</span>' +
          '</div>' +
          '<span class="text-body-sm text-primary font-semibold tabular-nums shrink-0">' + pctLabel(cat.amount / total) + '</span>';
        row.addEventListener('mouseenter', () => highlightSlice(type, i));
        row.addEventListener('mouseleave', () => clearSlice(type));
        row.addEventListener('click', () => { pieHover[type] === i ? clearSlice(type) : highlightSlice(type, i); });
        legendEl.appendChild(row);
      });
    }

    // 高亮某分类：其余扇区变淡、被选扇区沿中角方向外扩、环心切换为分类详情
    function highlightSlice(type, i) {
      const el = document.getElementById('pie-' + type);
      const geo = pieGeo[type];
      const slices = buildSlices(type);
      const total = slices.reduce((s, c) => s + (c.amount || 0), 0);
      if (!geo[i] || !slices[i]) return;
      pieHover[type] = i;
      const cx = 72, cy = 72;
      el.querySelectorAll('.pie-slice').forEach((p, idx) => {
        if (idx === i) {
          const rad = (geo[i].mid - 90) * Math.PI / 180;
          p.style.transform = 'translate(' + (5 * Math.cos(rad)).toFixed(2) + 'px,' + (5 * Math.sin(rad)).toFixed(2) + 'px)';
          p.classList.remove('is-dim');
        } else {
          p.style.transform = '';
          p.classList.add('is-dim');
        }
      });
      const cat = slices[i];
      const name = String(cat.name || '');
      const shortName = name.length > 6 ? name.slice(0, 6) + '…' : name;
      document.getElementById('pie-center-' + type).innerHTML =
        '<text x="' + cx + '" y="' + (cy - 14) + '" dominant-baseline="middle" text-anchor="middle" font-size="18">' + esc(cat.icon || '📝') + '</text>' +
        '<text x="' + cx + '" y="' + (cy + 4) + '" dominant-baseline="middle" text-anchor="middle" fill="#1f1a1d" font-size="13" font-weight="700">' + pctLabel(cat.amount / total) + '</text>' +
        '<text x="' + cx + '" y="' + (cy + 18) + '" dominant-baseline="middle" text-anchor="middle" fill="#877275" font-size="9">' + esc(shortName) + '</text>';
    }

    function clearSlice(type) {
      const el = document.getElementById('pie-' + type);
      pieHover[type] = -1;
      el.querySelectorAll('.pie-slice').forEach((p) => { p.style.transform = ''; p.classList.remove('is-dim'); });
      const cx = 72, cy = 72;
      document.getElementById('pie-center-' + type).innerHTML =
        '<text x="' + cx + '" y="' + cy + '" dominant-baseline="middle" text-anchor="middle" fill="#877275" font-size="10">' + (type === 'expense' ? '总支出' : '总收入') + '</text>';
    }

    // 收支趋势：12 个月折线图（支出/收入两条线，平滑曲线 + 渐变面积 + 悬停引导线/提示框 + 图例显隐）
    const TREND_EXPENSE_COLOR = '#eb6834'; // 支出 · 橙
    const TREND_INCOME_COLOR = '#2a78d6';  // 收入 · 蓝
    const trendVisible = { expense: true, income: true }; // 图例点击显隐各折线

    // 折线图纵轴量程取整（向上取到 1/2/5 × 10^n 的「漂亮」上界，单位为分）
    function niceCeil(v) {
      if (v <= 0) return 10000; // 空数据时给 ¥100 的默认量程
      const exp = Math.floor(Math.log10(v));
      const base = Math.pow(10, exp);
      const f = v / base;
      let nice = 10;
      if (f <= 1) nice = 1; else if (f <= 2) nice = 2; else if (f <= 5) nice = 5;
      return nice * base;
    }

    // Catmull-Rom → 三次贝塞尔平滑路径（张力 0.16），pts 为 [{x,y}]，返回 path d 字符串
    function smoothD(pts) {
      if (!pts.length) return '';
      let d = 'M ' + pts[0].x.toFixed(1) + ' ' + pts[0].y.toFixed(1);
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i];
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const p3 = pts[i + 2] || p2;
        const t = 0.16;
        const c1x = p1.x + (p2.x - p0.x) * t, c1y = p1.y + (p2.y - p0.y) * t;
        const c2x = p2.x - (p3.x - p1.x) * t, c2y = p2.y - (p3.y - p1.y) * t;
        d += ' C ' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
      }
      return d;
    }

    function renderLineChart() {
      const box = document.getElementById('trend-chart');
      const legendEl = document.getElementById('trend-legend');
      const monthly = stats?.monthly || [];

      // 图例：点击可显示/隐藏对应折线
      const legend = (key, color, label) =>
        '<span class="flex items-center gap-space-xs text-body-sm text-on-surface-variant cursor-pointer select-none transition-opacity" data-trend-toggle="' + key + '" style="opacity:' + (trendVisible[key] ? '1' : '0.4') + '">' +
          '<span class="w-2.5 h-2.5 rounded-full" style="background:' + color + '"></span>' + label + '</span>';
      legendEl.innerHTML = legend('expense', TREND_EXPENSE_COLOR, '支出') + legend('income', TREND_INCOME_COLOR, '收入');

      const hasData = monthly.some((m) => (m.expense || 0) > 0 || (m.income || 0) > 0);
      const W = 360, H = 230, ml = 46, mr = 14, mt = 14, mb = 28;
      const plotW = W - ml - mr, plotH = H - mt - mb;
      const x0 = ml, x1 = W - mr, y0 = mt, y1 = H - mb;

      let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="trend-svg w-full max-w-[440px] h-auto mx-auto block">';
      if (!hasData) {
        svg += '<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#877275" font-size="13">暂无数据</text></svg>';
        box.innerHTML = svg;
        return;
      }
      const vals = [];
      monthly.forEach((m) => { vals.push(m.expense || 0, m.income || 0); });
      const yMax = niceCeil(Math.max.apply(null, vals));
      const px = (i) => x0 + (i / (monthly.length - 1)) * plotW;
      const py = (v) => y1 - (v / yMax) * plotH;

      // 渐变面积 + 裁剪（防止平滑曲线在底部基准线以下溢出）
      svg += '<defs>' +
        '<linearGradient id="grad-t-exp" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="' + TREND_EXPENSE_COLOR + '" stop-opacity="0.20"></stop>' +
          '<stop offset="100%" stop-color="' + TREND_EXPENSE_COLOR + '" stop-opacity="0"></stop></linearGradient>' +
        '<linearGradient id="grad-t-inc" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="' + TREND_INCOME_COLOR + '" stop-opacity="0.20"></stop>' +
          '<stop offset="100%" stop-color="' + TREND_INCOME_COLOR + '" stop-opacity="0"></stop></linearGradient>' +
        '<clipPath id="trend-clip"><rect x="' + (x0 - 6) + '" y="' + (y0 - 6) + '" width="' + (plotW + 12) + '" height="' + (plotH + 12) + '"></rect></clipPath>' +
        '</defs>';

      // 横向网格 + 纵轴刻度（零线作基准线稍深）
      const ticks = [0, Math.floor(yMax / 2), yMax];
      ticks.forEach((t) => {
        const y = y1 - (t / yMax) * plotH;
        svg += '<line x1="' + x0 + '" y1="' + y.toFixed(1) + '" x2="' + x1 + '" y2="' + y.toFixed(1) + '" stroke="' + (t === 0 ? '#dac0c4' : '#f0e5e8') + '" stroke-width="1"></line>';
        svg += '<text x="' + (x0 - 6) + '" y="' + y.toFixed(1) + '" dominant-baseline="middle" text-anchor="end" fill="#877275" font-size="10">' + yuanCompact(t) + '</text>';
      });
      // 横轴月份标签
      monthly.forEach((m, i) => {
        svg += '<text x="' + px(i).toFixed(1) + '" y="' + (y1 + 15) + '" text-anchor="middle" fill="#877275" font-size="9">' + m.month + '月</text>';
      });
      // 折线组：渐变面积 + 平滑曲线 + 数据点（可整组显隐）
      const lineGroup = (key, color) => {
        const pts = monthly.map((m, i) => ({ x: px(i), y: py(m[key] || 0) }));
        const lineD = smoothD(pts);
        const areaD = lineD + ' L ' + pts[pts.length - 1].x.toFixed(1) + ' ' + y1 + ' L ' + pts[0].x.toFixed(1) + ' ' + y1 + ' Z';
        let s = '<g data-key="' + key + '" clip-path="url(#trend-clip)" style="display:' + (trendVisible[key] ? '' : 'none') + '">';
        s += '<path d="' + areaD + '" class="trend-area" fill="url(#grad-t-' + key + ')"></path>';
        s += '<path d="' + lineD + '" class="trend-line" pathLength="1" fill="none" stroke="' + color + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>';
        pts.forEach((p, i) => {
          s += '<circle class="trend-dot" data-i="' + i + '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.4" fill="#ffffff" stroke="' + color + '" stroke-width="2"></circle>';
        });
        s += '</g>';
        return s;
      };
      svg += lineGroup('expense', TREND_EXPENSE_COLOR);
      svg += lineGroup('income', TREND_INCOME_COLOR);
      // 悬停引导线 + 提示框（默认隐藏）
      svg += '<line id="trend-guide" x1="' + x0 + '" y1="' + y0 + '" x2="' + x0 + '" y2="' + y1 + '" stroke="#dac0c4" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"></line>';
      svg += '<g id="trend-tip" visibility="hidden"></g>';
      // 逐月热区（透明矩形，承接悬停/点按）
      const step = plotW / (monthly.length - 1);
      monthly.forEach((m, i) => {
        const cx = px(i);
        svg += '<rect data-i="' + i + '" x="' + (cx - step / 2).toFixed(1) + '" y="' + y0 + '" width="' + step.toFixed(1) + '" height="' + plotH + '" fill="transparent"></rect>';
      });
      svg += '</svg>';
      box.innerHTML = svg;

      // —— 交互：悬停高亮 / 点按钉住 / 图例显隐 ——
      let pinned = -1;
      const highlight = (i) => {
        const x = px(i);
        const guide = box.querySelector('#trend-guide');
        guide.setAttribute('x1', x.toFixed(1));
        guide.setAttribute('x2', x.toFixed(1));
        guide.setAttribute('visibility', 'visible');
        box.querySelectorAll('.trend-dot').forEach((d) => {
          d.style.transform = Number(d.dataset.i) === i ? 'scale(1.55)' : '';
        });
        const m = monthly[i];
        const expY = py(m.expense || 0), incY = py(m.income || 0);
        const topY = Math.min(expY, incY), botY = Math.max(expY, incY);
        let tipY = topY - 48;             // 默认放较高点上方
        if (tipY < 4) tipY = botY + 12;   // 上方放不下则放到较低点下方
        const tw = 148;
        const tx = Math.min(Math.max(x, tw / 2 + 4), W - tw / 2 - 4);
        const tip = box.querySelector('#trend-tip');
        tip.innerHTML =
          '<rect x="' + (tx - tw / 2).toFixed(1) + '" y="' + tipY.toFixed(1) + '" width="' + tw + '" height="40" rx="10" fill="#342f31" opacity="0.95"></rect>' +
          '<text x="' + tx.toFixed(1) + '" y="' + (tipY + 14).toFixed(1) + '" dominant-baseline="middle" text-anchor="middle" fill="#f9eef1" font-size="10" font-weight="700">' + m.month + '月</text>' +
          '<text x="' + tx.toFixed(1) + '" y="' + (tipY + 30).toFixed(1) + '" dominant-baseline="middle" text-anchor="middle" fill="#f9eef1" font-size="10">' +
            '<tspan fill="#ffb38f">支出 ¥' + yuanCompact(m.expense || 0) + '</tspan>' +
            '<tspan fill="#a7c8ff"> · 收入 ¥' + yuanCompact(m.income || 0) + '</tspan>' +
          '</text>';
        tip.setAttribute('visibility', 'visible');
      };
      const unhighlight = () => {
        const guide = box.querySelector('#trend-guide');
        guide.setAttribute('visibility', 'hidden');
        box.querySelectorAll('.trend-dot').forEach((d) => { d.style.transform = ''; });
        box.querySelector('#trend-tip').setAttribute('visibility', 'hidden');
      };
      box.querySelectorAll('rect[data-i]').forEach((r) => {
        const i = Number(r.dataset.i);
        r.addEventListener('mouseenter', () => highlight(i));
        r.addEventListener('mouseleave', () => { if (pinned < 0) unhighlight(); });
        r.addEventListener('click', () => {
          if (pinned === i) { pinned = -1; unhighlight(); }
          else { pinned = i; highlight(i); }
        });
      });
      legendEl.querySelectorAll('[data-trend-toggle]').forEach((span) => {
        span.addEventListener('click', () => {
          const key = span.dataset.trendToggle;
          trendVisible[key] = !trendVisible[key];
          span.style.opacity = trendVisible[key] ? '1' : '0.4';
          const g = box.querySelector('g[data-key="' + key + '"]');
          if (g) g.style.display = trendVisible[key] ? '' : 'none';
        });
      });
    }

    // 排行列表：按金额降序，分页渲染（PAGE_SIZE 条/页），滚到底/上滑到底自动加载下一页
    function rankCats(type) {
      return type === 'expense' ? (stats?.expenseCategories || []) : (stats?.incomeCategories || []);
    }
    function rankTotal(cats) {
      return cats.reduce((sum, c) => sum + (c.amount || 0), 0);
    }
    // 单张排行卡片：图标/名称/笔数/金额/占比条
    function makeRankItem(cat, i, total, unit) {
      const pctNum = total > 0 ? (cat.amount / total * 100) : 0;
      const color = CHART_COLORS[i % CHART_COLORS.length];
      const item = document.createElement('div');
      item.className = 'rounded-xl bg-surface-container-lowest p-space-md shadow-[0_2px_12px_rgba(155,63,90,0.04)] flex flex-col gap-space-xs';
      item.innerHTML =
        '<div class="flex items-center justify-between">' +
          '<div class="flex items-center gap-space-sm">' +
            '<div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background:' + color + '22;color:' + color + '">' +
              '<span class="text-[18px] leading-none">' + esc(cat.icon || '📝') + '</span>' +
            '</div>' +
            '<div class="flex flex-col">' +
              '<span class="text-label-lg text-on-surface">' + esc(cat.name) + '</span>' +
              '<span class="text-body-sm text-on-surface-variant">' + (cat.count || 0) + unit + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="flex flex-col items-end">' +
            '<span class="text-label-lg text-on-surface font-bold">¥ ' + centsToYuan(cat.amount) + '</span>' +
            '<span class="text-body-sm text-primary">' + pctNum.toFixed(1) + '%</span>' +
          '</div>' +
        '</div>' +
        '<div class="w-full h-2 bg-surface-container rounded-full overflow-hidden mt-1">' +
          '<div class="h-full rounded-full" style="width:' + pctNum + '%;background:' + color + '"></div>' +
        '</div>';
      return item;
    }
    // 渲染第一页
    function renderList(type) {
      shown[type] = 0;
      document.getElementById('list-' + type).innerHTML = '';
      appendList(type);
    }
    // 追加一页（PAGE_SIZE 条）；末尾挂哨兵，滚到底/上滑到底时自动加载下一页
    function appendList(type) {
      const list = document.getElementById('list-' + type);
      const cats = rankCats(type);
      const total = rankTotal(cats);
      const unit = type === 'expense' ? '笔消费' : '笔收入';
      const start = shown[type];
      const end = Math.min(start + PAGE_SIZE, cats.length);
      const old = list.querySelector('.rank-sentinel');
      if (old) old.remove();
      for (let i = start; i < end; i++) list.appendChild(makeRankItem(cats[i], i, total, unit));
      shown[type] = end;
      const sentinel = document.createElement('div');
      sentinel.className = 'rank-sentinel flex items-center justify-center py-2 text-body-sm text-on-surface-variant';
      if (end < cats.length) sentinel.textContent = '继续滚动加载更多';
      else if (cats.length > 0) { sentinel.textContent = '— 已显示全部 ' + cats.length + ' 条 —'; sentinel.dataset.done = '1'; }
      else sentinel.dataset.done = '1';
      list.appendChild(sentinel);
    }
    // 观察当前列表末尾哨兵：进入视口（桌面下滚 / 手机端上滑）即追加下一页
    function observeSentinel(type) {
      if (sentinelObserver) sentinelObserver.disconnect();
      const sentinel = document.getElementById('list-' + type).querySelector('.rank-sentinel');
      if (!sentinel || sentinel.dataset.done === '1') return;
      sentinelObserver = new IntersectionObserver((entries) => {
        if (entries.some((e) => e.isIntersecting)) {
          appendList(type);
          observeSentinel(type);
        }
      }, { rootMargin: '120px 0px' });
      sentinelObserver.observe(sentinel);
    }

    function renderEmpty() {
      const has = (stats?.totalCount || 0) > 0;
      const empty = document.getElementById('empty-state');
      if (has) { empty.classList.add('hidden'); empty.classList.remove('flex'); }
      else { empty.classList.remove('hidden'); empty.classList.add('flex'); }
    }

    /* —— 年份选择器 —— */
    function openYearPicker() {
      // 可选年份 = 2000（账单可记账的最早年份）~ 当前自然年，单列展示；上界固定 THIS_YEAR，不随所选年份变化
      const years = [];
      for (let y = 2000; y <= THIS_YEAR; y++) years.push(y);
      const grid = document.getElementById('year-grid');
      grid.innerHTML = '';
      years.forEach((y) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = y + '年';
        const sel = y === curYear;
        b.className = 'py-2 rounded-full text-label-md transition-all active:scale-95 ' +
          (sel ? 'bg-primary text-on-primary font-bold shadow-sm' : 'bg-surface-container-low text-on-surface-variant hover:bg-primary-fixed');
        b.onclick = () => pickYear(y);
        grid.appendChild(b);
      });
      document.getElementById('year-pop').style.display = 'flex';
    }
    function closeYearPicker() {
      document.getElementById('year-pop').style.display = 'none';
    }
    function pickYear(y) {
      closeYearPicker();
      if (y === curYear) return;
      loadStats(y);
    }

    /* —— 导出数据：把当前年度统计整合为 Excel(.xlsx) 下载 —— */
    function buildRows() {
      const s = stats || {};
      const expCats = s.expenseCategories || [];
      const incCats = s.incomeCategories || [];
      const expTotal = expCats.reduce((sum, c) => sum + (c.amount || 0), 0);
      const incTotal = incCats.reduce((sum, c) => sum + (c.amount || 0), 0);
      const maxExp = s.maxExpense && s.maxExpense.amount > 0 ? s.maxExpense : null;

      const rows = [
        ['财务管家 年度统计'],
        ['统计年份', curYear + '年'],
        [],
        ['记账概况', '数值'],
        ['记账笔数', (s.totalCount || 0) + ' 笔'],
        ['月均支出(元)', centsToYuan(s.monthlyAvgExpense || 0)],
        ['最大单笔(元)', maxExp ? centsToYuan(maxExp.amount) + '（' + (maxExp.categoryName || '') + '）' : '—'],
        [],
        ['支出分类排行', '金额(元)', '笔数', '占比'],
      ];
      expCats.forEach((c) => rows.push([c.name, centsToYuan(c.amount), String(c.count || 0), expTotal > 0 ? (c.amount / expTotal * 100).toFixed(1) + '%' : '0.0%']));
      rows.push([]);
      rows.push(['收入分类排行', '金额(元)', '笔数', '占比']);
      incCats.forEach((c) => rows.push([c.name, centsToYuan(c.amount), String(c.count || 0), incTotal > 0 ? (c.amount / incTotal * 100).toFixed(1) + '%' : '0.0%']));
      return rows;
    }

    function exportData() {
      if (typeof XLSX === 'undefined') {
        showExportToast('导出组件未加载，请联网后重试');
        return;
      }
      const rows = buildRows();
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{ wch: 16 }, { wch: 14 }, { wch: 10 }, { wch: 10 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '年度统计');
      const name = '财务管家-年度统计-' + curYear + '.xlsx';
      XLSX.writeFile(wb, name);
      showExportToast('已导出 ' + name);
    }

    function showExportToast(text) {
      const toast = document.getElementById('export-toast');
      document.getElementById('export-toast-text').textContent = text;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(showExportToast._t);
      showExportToast._t = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2200);
    }

    loadStats(curYear);
  </script>
