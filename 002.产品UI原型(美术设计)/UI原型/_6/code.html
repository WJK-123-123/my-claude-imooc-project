<!DOCTYPE html><html lang="zh-CN" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#fff8f9;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-sm"><button class="w-10 h-10 flex items-center justify-center text-on-surface rounded-full hover:bg-surface-variant/20" onclick="history.back()"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><span class="text-headline-md font-headline-md text-on-surface">账号注册</span></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-gutter pt-16 pb-space-xl bg-[#FFF4F7] flex-1"><div class="flex flex-col w-full max-w-md mx-auto items-center py-space-md">
<!-- Cute Logo & Title Header -->
<div class="flex flex-col items-center mb-6"><div class="w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center shadow-lg shadow-primary/10 relative overflow-hidden mb-4 group"><div class="absolute inset-0 bg-gradient-to-tr from-primary/20 to-transparent"></div><span class="material-symbols-outlined text-[40px] text-primary transition-transform duration-300 group-hover:scale-110" style="font-variation-settings: 'FILL' 1;">pets</span></div><h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight">财务管家</h1><p class="font-body-md text-body-md text-outline mt-1.5 tracking-wide">极简记账，治愈生活</p></div>
<!-- Main Card Container -->
<div class="w-full bg-surface-container-lowest rounded-3xl p-space-lg shadow-[0_16px_32px_rgba(155,63,90,0.06)] relative overflow-hidden">
<!-- Tab Switcher -->
<div class="flex bg-surface-container p-1 rounded-2xl mb-space-lg relative">
<div class="absolute top-1 bottom-1 w-[calc(50%-4px)] bg-surface-container-lowest rounded-xl shadow-sm transition-all duration-300 ease-out left-1" id="tab-indicator" style="transform: translateX(100%);"></div>


</div>
<!-- Login Form -->
<form class="flex flex-col gap-4" id="form-login" onsubmit="event.preventDefault();"><div class="space-y-1.5"><label class="font-label-md text-label-md text-on-surface-variant ml-1">账号</label><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-4 text-outline text-[20px]">person_outline</span><input class="w-full h-12 pl-12 pr-4 bg-surface-container-low rounded-2xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="用户名或手机号" type="text"></div></div><div class="space-y-1.5"><label class="font-label-md text-label-md text-on-surface-variant ml-1">密码</label><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-4 text-outline text-[20px]">lock_outline</span><input class="w-full h-12 pl-12 pr-12 bg-surface-container-low rounded-2xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="输入登录密码" type="password"><button class="absolute right-4 text-outline hover:text-on-surface" onclick="togglePassword(this)" type="button"><span class="material-symbols-outlined text-[20px]">visibility_off</span></button></div></div><div class="flex items-center justify-between px-1 pt-1"><label class="flex items-center gap-space-xs cursor-pointer select-none"><input class="w-4 h-4 rounded text-primary accent-primary cursor-pointer" type="checkbox"><span class="font-body-sm text-body-sm text-outline">自动登录</span></label><a aria-label="找回密码 / 忘记密码" class="font-body-sm text-body-sm text-primary hover:underline hover:text-on-surface transition-colors cursor-pointer select-none" href="#" title="通过手机号或邮箱找回密码">忘记密码？</a></div><button class="w-full h-12 mt-2 bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg rounded-full shadow-md shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs tracking-wider" type="submit"><span class="">登录</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span></button><div class="flex items-center gap-1.5 justify-center mt-3 text-[11px] text-outline/80"><input class="w-3.5 h-3.5 rounded text-primary accent-primary cursor-pointer" id="login-agreement" type="checkbox"><label class="font-body-sm select-none" for="login-agreement">我已阅读并同意 <a class="text-primary hover:underline" href="#">《用户协议》</a> 与 <a class="text-primary hover:underline" href="#">《隐私政策》</a></label></div></form>
<!-- Register Form -->
<form class="flex flex-col gap-4 hidden" id="form-register" onsubmit="event.preventDefault();"><div class="space-y-1.5"><label class="font-label-md text-label-md text-on-surface-variant ml-1">用户名</label><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-4 text-outline text-[20px]">badge</span><input class="w-full h-12 pl-12 pr-4 bg-surface-container-low rounded-2xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="2-20位中英文或数字" type="text"></div></div><div class="space-y-1.5"><label class="font-label-md text-label-md text-on-surface-variant ml-1">密码</label><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-4 text-outline text-[20px]">lock_outline</span><input class="w-full h-12 pl-12 pr-12 bg-surface-container-low rounded-2xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="6-20位安全密码" type="password"><button class="absolute right-4 text-outline hover:text-on-surface" onclick="togglePassword(this)" type="button"><span class="material-symbols-outlined text-[20px]">visibility_off</span></button></div></div><div class="space-y-1.5"><label class="font-label-md text-label-md text-on-surface-variant ml-1">确认密码</label><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-4 text-outline text-[20px]">verified_user</span><input class="w-full h-12 pl-12 pr-12 bg-surface-container-low rounded-2xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="再次输入密码" type="password"><button class="absolute right-4 text-outline hover:text-on-surface" onclick="togglePassword(this)" type="button"><span class="material-symbols-outlined text-[20px]">visibility_off</span></button></div></div><div class="flex items-center justify-center gap-1.5 mt-2 text-[11px] text-outline/80 leading-normal"><input checked="" class="w-3.5 h-3.5 rounded text-primary accent-primary cursor-pointer" id="reg-agreement" type="checkbox"><label class="font-body-sm select-none" for="reg-agreement">已阅读并同意 <a class="text-primary hover:underline" href="#">《用户协议》</a> 与 <a class="text-primary hover:underline" href="#">《隐私政策》</a> (限18岁以上)</label></div><button class="w-full h-12 mt-2 bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg rounded-full shadow-md shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs tracking-wider" type="submit"><span class="">立即注册</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span></button><div class="text-center mt-3"><button class="font-body-sm text-body-sm text-primary hover:underline font-label-md inline-flex items-center gap-1 cursor-pointer transition-colors" onclick="switchTab('login')" type="button"><span class="">已有账号？直接登录</span><span class="material-symbols-outlined text-[14px]">arrow_forward</span></button></div></form>
</div>
<!-- Delightful Footer Note -->
<div class="flex items-center gap-1.5 mt-8 text-outline/70 opacity-90"><span class="material-symbols-outlined text-[15px]">eco</span><span class="font-body-sm text-[12px] tracking-wide">每一笔记账，都是对生活的小小热爱</span></div>
<script>
    function switchTab(tab) {
      const indicator = document.getElementById('tab-indicator');
      const btnLogin = document.getElementById('btn-login');
      const btnRegister = document.getElementById('btn-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');

      if (tab === 'login') {
        indicator.style.transform = 'translateX(0%)';
        btnLogin.className = 'flex-1 py-2.5 text-center font-label-lg text-label-lg text-on-surface relative z-10 transition-colors duration-200';
        btnRegister.className = 'flex-1 py-2.5 text-center font-label-lg text-label-lg text-outline relative z-10 transition-colors duration-200';
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
      } else {
        indicator.style.transform = 'translateX(100%)';
        btnLogin.className = 'flex-1 py-2.5 text-center font-label-lg text-label-lg text-outline relative z-10 transition-colors duration-200';
        btnRegister.className = 'flex-1 py-2.5 text-center font-label-lg text-label-lg text-on-surface relative z-10 transition-colors duration-200';
        formLogin.classList.add('hidden');
        formRegister.classList.remove('hidden');
      }
    }

    function togglePassword(btn) {
      const input = btn.previousElementSibling;
      const icon = btn.querySelector('.material-symbols-outlined');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility_off';
      }
    }
  </script>
</div></main>




</body></html>
