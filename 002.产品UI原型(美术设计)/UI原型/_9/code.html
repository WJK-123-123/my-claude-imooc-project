<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#fff8f9;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-sm"><button class="w-10 h-10 flex items-center justify-center text-on-surface rounded-full hover:bg-surface-variant/20" onclick="history.back()"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><span class="text-headline-md font-headline-md text-on-surface">登录注册</span></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-gutter pt-16 pb-space-xl bg-[#FFF4F7] flex-1"><div class="flex flex-col w-full max-w-md mx-auto items-center py-space-md">
<!-- Cute Logo & Title Header -->
<div class="flex flex-col items-center mb-space-lg">
<div class="w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center shadow-lg shadow-primary/10 relative overflow-hidden mb-space-sm group">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/20 to-transparent"></div>
<span class="material-symbols-outlined text-[40px] text-primary transition-transform duration-300 group-hover:scale-110" style="font-variation-settings: 'FILL' 1;">pets</span>
<!-- Decorative sparkle -->
<span class="material-symbols-outlined absolute top-2 right-2 text-primary-container text-[16px] animate-pulse">drive_file_rename_outline</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight">财务管家</h1>
<p class="font-body-md text-body-md text-outline mt-space-xs">让记账像撸猫一样治愈轻松 ✨</p>
</div>
<!-- Main Card Container -->
<div class="w-full bg-surface-container-lowest rounded-3xl p-space-lg shadow-[0_16px_32px_rgba(155,63,90,0.06)] relative overflow-hidden">
<!-- Tab Switcher -->
<div class="flex bg-surface-container p-1 rounded-2xl mb-space-lg relative">
<div class="absolute top-1 bottom-1 w-[calc(50%-4px)] bg-surface-container-lowest rounded-xl shadow-sm transition-all duration-300 ease-out left-1" id="tab-indicator"></div>
<button class="flex-1 py-2.5 text-center font-label-lg text-label-lg text-on-surface relative z-10 transition-colors duration-200" id="btn-login" onclick="switchTab('login')">登录</button>
<button class="flex-1 py-2.5 text-center font-label-lg text-label-lg text-outline relative z-10 transition-colors duration-200" id="btn-register" onclick="switchTab('register')">注册</button>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-space-md" id="form-login" onsubmit="event.preventDefault();">
<div class="space-y-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">用户名 / 手机号</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px]">person_outline</span>
<input class="w-full h-12 pl-12 pr-4 bg-surface-container-low rounded-2xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="请输入可爱昵称或手机号" type="text">
</div>
</div>
<div class="space-y-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">密码</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px]">lock_outline</span>
<input class="w-full h-12 pl-12 pr-12 bg-surface-container-low rounded-2xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="请输入安全密码" type="password">
<button class="absolute right-4 text-outline hover:text-on-surface" onclick="togglePassword(this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center justify-between px-1">
<label class="flex items-center gap-space-xs cursor-pointer select-none">
<input class="w-4 h-4 rounded text-primary accent-primary cursor-pointer" type="checkbox">
<span class="font-body-sm text-body-sm text-outline">自动登录</span>
</label>
<a aria-label="找回密码 / 忘记密码" class="font-body-sm text-body-sm text-primary hover:underline hover:text-on-surface transition-colors cursor-pointer select-none" href="#" title="通过手机号或邮箱找回密码">忘记密码？</a>
</div>
<button class="w-full h-12 mt-space-sm bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg rounded-2xl shadow-md shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs" type="submit">
<span class="">开启记账之旅</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<div class="flex items-center gap-space-xs justify-center mt-space-sm">
<input class="w-4 h-4 rounded text-primary accent-primary cursor-pointer" id="login-agreement" type="checkbox">
<label class="font-body-sm text-body-sm text-outline select-none" for="login-agreement">
          我已阅读并同意 <a class="text-primary hover:underline" href="#">用户协议</a> 与 <a class="text-primary hover:underline" href="#">隐私政策</a>
</label>
</div>
</form>
<!-- Register Form -->
<form class="flex flex-col gap-space-md hidden" id="form-register" onsubmit="event.preventDefault();">
<div class="space-y-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">用户名</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px]">badge</span>
<input class="w-full h-12 pl-12 pr-4 bg-surface-container-low rounded-2xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="起一个好听的昵称" type="text">
</div>
</div>
<div class="space-y-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">设置密码</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px]">lock_outline</span>
<input class="w-full h-12 pl-12 pr-12 bg-surface-container-low rounded-2xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="包含数字与字母的6位以上密码" type="password">
<button class="absolute right-4 text-outline hover:text-on-surface" onclick="togglePassword(this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="space-y-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">确认密码</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px]">verified_user</span>
<input class="w-full h-12 pl-12 pr-4 bg-surface-container-low rounded-2xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="再次输入密码确认" type="password">
</div>
</div>
<button class="w-full h-12 mt-space-sm bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg rounded-2xl shadow-md shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs" type="submit">
<span class="">加入财务小窝</span>
<span class="material-symbols-outlined text-[18px]">favorite</span>
</button>
<div class="flex items-center gap-space-xs justify-center mt-space-sm">
<input class="w-4 h-4 rounded text-primary accent-primary cursor-pointer" id="reg-agreement" type="checkbox">
<label class="font-body-sm text-body-sm text-outline select-none" for="reg-agreement">
          同意 <a class="text-primary hover:underline" href="#">用户服务协议</a> 与 <a class="text-primary hover:underline" href="#">隐私政策</a>
</label>
</div>
</form>
</div>
<!-- Delightful Footer Note -->
<div class="flex items-center gap-space-xs mt-space-lg text-outline">
<span class="material-symbols-outlined text-[16px]">eco</span>
<span class="font-body-sm text-body-sm">每一笔记账，都是对生活的小小热爱</span>
</div>
<script>
    function switchTab(tab) {
      const indicator = document.getElementById('tab-indicator');
      const btnLogin = document.getElementById('btn-login');
      const btnRegister = document.getElementById('btn-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');

      if (tab === 'login') {
        indicator.style.transform = 'translateX(0%)';
        btnLogin.className = 'flex-1 py-2.5 text-center font-label-lg text-label-lg text-on-surface relative z-10 transition-colors duration-200';
        btnRegister.className = 'flex-1 py-2.5 text-center font-label-lg text-label-lg text-outline relative z-10 transition-colors duration-200';
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
      } else {
        indicator.style.transform = 'translateX(100%)';
        btnLogin.className = 'flex-1 py-2.5 text-center font-label-lg text-label-lg text-outline relative z-10 transition-colors duration-200';
        btnRegister.className = 'flex-1 py-2.5 text-center font-label-lg text-label-lg text-on-surface relative z-10 transition-colors duration-200';
        formLogin.classList.add('hidden');
        formRegister.classList.remove('hidden');
      }
    }

    function togglePassword(btn) {
      const input = btn.previousElementSibling;
      const icon = btn.querySelector('.material-symbols-outlined');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility_off';
      }
    }
  </script>
</div></main>



</body></html>
