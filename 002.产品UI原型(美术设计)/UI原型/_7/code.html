<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#fff8f9;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-sm"><button class="w-10 h-10 flex items-center justify-center text-on-surface rounded-full hover:bg-surface-variant/20" onclick="history.back()"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><span class="text-headline-md font-headline-md text-on-surface">找回密码</span></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-gutter pt-16 pb-space-xl bg-[#FFF4F7] flex-1"><div class="flex flex-col w-full max-w-[480px] mx-auto pb-space-xl">
<!-- Top Cute Mascot & Sparkle Banner -->
<div class="relative flex flex-col items-center pt-space-xs pb-space-sm text-center">
<!-- Ambient Blossom Halo -->
<div class="absolute -top-3 w-36 h-36 bg-primary-fixed/40 rounded-full blur-2xl pointer-events-none"></div>
<!-- Cute Paw & Key Mascot Badge -->
<div class="relative w-20 h-20 rounded-[28px] bg-surface-container-lowest shadow-md flex items-center justify-center mb-space-sm">
<div class="w-14 h-14 rounded-[20px] bg-primary-fixed flex items-center justify-center text-primary relative">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">pets</span>
<!-- Floating Key Badge -->
<span class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[14px]">key</span>
</span>
</div>
<!-- Sparkling Stars -->
<span class="absolute -top-1 -right-1 text-primary-container material-symbols-outlined text-[16px] animate-pulse">auto_awesome</span>
<span class="absolute bottom-2 -left-2 text-primary-container material-symbols-outlined text-[14px]">arrow_back_ios_new</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-1">
      找回密码
      <span class="inline-block w-2 h-2 rounded-full bg-primary-container"></span>
</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">
      别担心，3步快速找回您的登录密码 ✨
    </p>
</div>
<!-- Step Progress Indicator -->
<div class="bg-surface-container-lowest rounded-[20px] p-space-md shadow-sm mb-space-md">
<div class="flex items-center justify-between relative px-space-xs">
<!-- Step 1: Active -->
<div class="flex flex-col items-center z-10">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-md text-label-md shadow-sm">
          1
        </div>
<span class="font-label-sm text-label-sm text-primary font-bold mt-1.5">验证账号</span>
</div>
<!-- Connecting Track 1 -->
<div class="flex-1 h-1 bg-primary-fixed mx-2 -mt-5 rounded-full relative overflow-hidden">
<div class="w-1/2 h-full bg-primary rounded-full"></div>
</div>
<!-- Step 2: In-progress -->
<div class="flex flex-col items-center z-10">
<div class="w-8 h-8 rounded-full bg-primary-fixed text-primary flex items-center justify-center font-label-md text-label-md shadow-sm">
          2
        </div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1.5">重设密码</span>
</div>
<!-- Connecting Track 2 -->
<div class="flex-1 h-1 bg-surface-container-high mx-2 -mt-5 rounded-full"></div>
<!-- Step 3: Pending -->
<div class="flex flex-col items-center z-10">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-outline flex items-center justify-center font-label-md text-label-md">
          3
        </div>
<span class="font-label-sm text-label-sm text-outline mt-1.5">完成</span>
</div>
</div>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-[24px] p-space-md shadow-sm flex flex-col gap-space-md">
<!-- Field 1: Username -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="">用户名</span>
</label>
<div class="relative flex items-center rounded-[18px] bg-surface-container-low px-space-md py-2.5 transition-all focus-within:bg-surface focus-within:shadow-sm">
<span class="material-symbols-outlined text-outline text-[20px] mr-2">badge</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none min-w-0" id="usernameInput" placeholder="请输入您的注册用户名 (如: xiaolin)" type="text">
</div>
</div>
<!-- Field 2: Verification Code -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="">安全验证码</span>
</label>
<div class="relative flex items-center justify-between rounded-[18px] bg-surface-container-low px-space-md py-1.5 transition-all focus-within:bg-surface focus-within:shadow-sm">
<div class="flex items-center flex-1 min-w-0 mr-2">
<span class="material-symbols-outlined text-outline text-[20px] mr-2">shield</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none tracking-widest min-w-0" id="codeInput" maxlength="6" placeholder="请输入6位验证码" type="text">
</div>
<button class="px-3.5 py-2 rounded-full bg-primary-fixed text-primary font-label-md text-label-md hover:bg-primary hover:text-on-primary transition-colors whitespace-nowrap active:scale-95 shadow-sm" id="codeBtn" onclick="handleSendCode()" type="button">
          获取验证码
        </button>
</div>
</div>
<!-- Field 3: New Password -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
<span class="">设置新密码</span>
</label>
<div class="relative flex items-center rounded-[18px] bg-surface-container-low px-space-md py-2.5 transition-all focus-within:bg-surface focus-within:shadow-sm">
<span class="material-symbols-outlined text-outline text-[20px] mr-2">lock</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none min-w-0" id="passwordInput" placeholder="请输入6-20位新密码" type="password">
<button class="text-outline hover:text-primary transition-colors p-1 flex items-center justify-center" onclick="toggleVisibility('passwordInput', 'pwdEyeIcon')" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwdEyeIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Field 4: Confirm New Password -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">task_alt</span>
<span class="">确认新密码</span>
</label>
<div class="relative flex items-center rounded-[18px] bg-surface-container-low px-space-md py-2.5 transition-all focus-within:bg-surface focus-within:shadow-sm">
<span class="material-symbols-outlined text-outline text-[20px] mr-2">lock_clock</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none min-w-0" id="confirmPasswordInput" placeholder="请再次输入新密码" type="password">
<button class="text-outline hover:text-primary transition-colors p-1 flex items-center justify-center" onclick="toggleVisibility('confirmPasswordInput', 'confirmEyeIcon')" type="button">
<span class="material-symbols-outlined text-[20px]" id="confirmEyeIcon">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Warm Reminder Card -->
<div class="mt-space-md bg-surface-container-low rounded-[20px] p-space-md flex gap-2.5 items-start">
<div class="w-7 h-7 rounded-full bg-primary-fixed/60 flex items-center justify-center flex-shrink-0 text-primary mt-0.5">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">volunteer_activism</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-primary font-bold mb-0.5">管家温馨提示</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
        验证码将发送至绑定的安全验证通道。若未收到，请检查垃圾箱或稍后重试。密码错误累计5次将锁定10分钟保护账号安全。
      </p>
</div>
</div>
<!-- Action Button -->
<div class="mt-space-lg flex flex-col items-center gap-space-md">
<button class="w-full h-13 py-3.5 rounded-full bg-gradient-to-r from-primary-container to-primary text-on-primary font-label-lg text-label-lg tracking-wide flex items-center justify-center gap-1.5 shadow-md hover:shadow-lg active:scale-[0.98] transition-all" id="submitResetBtn" onclick="handleResetSubmit()" type="button">
<span class="">重置密码并登录</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Bottom Quick Jump Back to Login -->
<a class="inline-flex items-center gap-1 font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors py-1" href="javascript:void(0)" onclick="history.back()">
<span class="">想起密码了？</span>
<span class="text-primary font-bold underline decoration-primary-container decoration-2 underline-offset-4">去登录</span>
<span class="material-symbols-outlined text-[16px] text-primary">login</span>
</a>
</div>
</div>
<script>
  function toggleVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility';
      icon.classList.add('text-primary');
    } else {
      input.type = 'password';
      icon.textContent = 'visibility_off';
      icon.classList.remove('text-primary');
    }
  }

  let countdown = 0;
  let timer = null;

  function handleSendCode() {
    const btn = document.getElementById('codeBtn');
    const username = document.getElementById('usernameInput')?.value.trim();
    if (!username) {
      alert('请先输入注册用户名哦 🐾');
      document.getElementById('usernameInput')?.focus();
      return;
    }
    if (countdown > 0) return;

    countdown = 60;
    btn.disabled = true;
    btn.classList.add('opacity-60', 'cursor-not-allowed');

    const updateLabel = () => {
      btn.textContent = `${countdown}s 后重发`;
    };

    updateLabel();
    timer = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = '获取验证码';
        btn.classList.remove('opacity-60', 'cursor-not-allowed');
      } else {
        updateLabel();
      }
    }, 1000);
  }

  function handleResetSubmit() {
    const username = document.getElementById('usernameInput')?.value.trim();
    const code = document.getElementById('codeInput')?.value.trim();
    const pwd = document.getElementById('passwordInput')?.value;
    const confirmPwd = document.getElementById('confirmPasswordInput')?.value;

    if (!username) {
      alert('请输入用户名');
      return;
    }
    if (!code || code.length !== 6) {
      alert('请输入6位数字验证码');
      return;
    }
    if (!pwd || pwd.length < 6 || pwd.length > 20) {
      alert('密码长度需在6-20位之间');
      return;
    }
    if (pwd !== confirmPwd) {
      alert('两次输入的密码不一致，请仔细检查');
      return;
    }

    const btn = document.getElementById('submitResetBtn');
    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>重置中...</span>`;

    setTimeout(() => {
      alert('密码重置成功！正在为您自动登录 🌸');
      history.back();
    }, 1200);
  }
</script></main>

</body></html>
