<!-- Number Pad Simulation -->

<button class="py-4 bg-surface-container-lowest rounded-lg font-headline-md text-on-surface hover:bg-surface-container active:scale-95 transition-all shadow-xs" onclick="appendNum('9')">9</button>

<script>
    function switchTab(type) {
      const expBtn = document.getElementById('tab-expense');
      const incBtn = document.getElementById('tab-income');
      if (type === 'expense') {
        expBtn.className = "flex-1 py-2 rounded-full text-label-lg transition-all bg-primary text-on-primary shadow-sm";
        incBtn.className = "flex-1 py-2 rounded-full text-label-lg transition-all text-on-surface-variant hover:text-on-surface";
      } else {
        incBtn.className = "flex-1 py-2 rounded-full text-label-lg transition-all bg-secondary text-on-secondary shadow-sm";
        expBtn.className = "flex-1 py-2 rounded-full text-label-lg transition-all text-on-surface-variant hover:text-on-surface";
      }
    }

    function selectCategory(btn) {
      document.querySelectorAll('.category-btn').forEach(b => {
        b.classList.remove('border-primary', 'selected');
        b.classList.add('border-transparent');
        const iconWrap = b.querySelector('div');
        iconWrap.className = "w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant mb-space-xs group-hover:scale-110 transition-transform";
      });
      btn.classList.add('border-primary', 'selected');
      btn.classList.remove('border-transparent');
      const iconWrap = btn.querySelector('div');
      iconWrap.className = "w-12 h-12 rounded-full bg-primary-container/30 flex items-center justify-center text-on-primary-container mb-space-xs group-hover:scale-110 transition-transform";
    }

    function selectPayment(btn) {
      document.querySelectorAll('.pay-btn').forEach(b => {
        b.className = "pay-btn px-space-md py-1.5 rounded-full bg-surface-container text-on-surface-variant text-body-sm font-medium transition-all";
      });
      btn.className = "pay-btn px-space-md py-1.5 rounded-full bg-primary text-on-primary text-body-sm font-medium transition-all shadow-xs";
    }

    function appendNum(val) {
      const input = document.getElementById('amount-input');
      let current = input.value;
      if (current === '0.00') current = '';
      
      if (val === 'C') {
        input.value = '0.00';
        return;
      }
      if (val === 'del') {
        current = current.slice(0, -1);
        input.value = current === '' ? '0.00' : current;
        return;
      }
      if (val === '.' && current.includes('.')) return;
      
      input.value = current + val;
    }

    function addNewCategory() {
      const name = prompt("请输入新分类名称：");
      if (name) {
        const grid = document.getElementById('category-grid');
        const newBtn = document.createElement('button');
        newBtn.onclick = function() { selectCategory(this); };
        newBtn.className = "category-btn flex flex-col items-center justify-center p-space-md rounded-xl bg-surface-container-low hover:bg-surface-container transition-all group border-2 border-transparent";
        newBtn.innerHTML = `
          <div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant mb-space-xs group-hover:scale-110 transition-transform">
            <span class="material-symbols-outlined">star</span>
          </div>
          <span class="text-body-md font-medium text-on-surface">${name}</span>
        `;
        grid.insertBefore(newBtn, grid.lastElementChild);
        selectCategory(newBtn);
      }
    }

    function handleSave() {
      const toast = document.getElementById('success-toast');
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      
      const btn = document.getElementById('save-btn');
      btn.classList.add('animate-pulse');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
        btn.classList.remove('animate-pulse');
        document.getElementById('amount-input').value = '0.00';
      }, 1500);
    }
  </script>
